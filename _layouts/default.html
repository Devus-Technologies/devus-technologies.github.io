<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}Devus Technologies</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="/assets/packet-odyssey/icon-512.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Devus Technologies</a>
    <nav>
      <a href="/">Apps</a>
      <a href="/legal/">Legal / Mentions légales</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>© 2026 Devus Technologies · <a href="mailto:erci.david.anderson@gmail.com">erci.david.anderson@gmail.com</a></p>
      </footer>
  <script>
    (function () {
      var body = document.body;
      if (!document.querySelector('[data-l]')) return;
      var saved = null;
      try { saved = localStorage.getItem('lang'); } catch (e) {}
      var lang = saved || ((navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
      function set(l) {
        body.classList.remove('en', 'fr');
        body.classList.add('js', l);
        document.documentElement.lang = l;
        document.querySelectorAll('.lang button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.set === l));
        });
        try { localStorage.setItem('lang', l); } catch (e) {}
      }
      document.querySelectorAll('.lang button').forEach(function (b) {
        b.addEventListener('click', function () { set(b.dataset.set); });
      });
      set(lang);
    })();
  </script>
</body>
</html>
